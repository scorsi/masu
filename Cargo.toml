[package]
name = "masu"
version = "0.1.0"
edition = "2024"
description = "Metric store: raw scrape archive and the metric convention"

# Direct dependencies are limited to ADR 0002.
[dependencies]
hyper = { version = "1", features = ["server", "http1", "http2", "client"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
prost = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "time", "signal", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
zstd = "0.14"

[build-dependencies]
prost-build = "0.13"


[features]
# The test pusher of ADR 0009 (docs/delivery-scenarios.md): not shipped in the package.
pusher = []

[[bin]]
name = "masu"
path = "src/main.rs"

[[bin]]
name = "masu-pusher"
path = "src/pusher.rs"
required-features = ["pusher"]
