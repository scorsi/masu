# Unit tests, fixtures, module checks and the nixosTests on every push, on the Linux runner,
# each check built in its own nix process.
on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: linux
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      # One nix process per check: evaluating every nixosTest in one process
      # (nix flake check) peaks around 6-9 GB; one check at a time stays near 2 GB.
      - run: |
          failed=
          for c in $(nix eval --raw .#checks.aarch64-linux --apply 'c: builtins.concatStringsSep " " (builtins.attrNames c)'); do
            nix build -L --no-link ".#checks.aarch64-linux.$c" || failed="$failed $c"
          done
          if [ -n "$failed" ]; then echo "failed checks:$failed"; exit 1; fi
